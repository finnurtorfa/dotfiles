# ┌──────────────────────────────────────────────────────────────┐
# |                         Keybindings                          |
# └──────────────────────────────────────────────────────────────┘

$Modifier = SUPER
$AlMod    = Alt

# ----------------------------
# Launchers & Utilities
# ----------------------------
bind = $Modifier, Return, exec, $terminal
bind = $Modifier, E, exec, $fileManager
bind = $Modifier, D, exec, $menu
bind = $Modifier, Tab, global, quickshell:overviewWorkspacesToggle
bind = $Modifier, W, exec, $browser
bind = $Modifier, F, exec, $editor
bind = CTRL ALT, Delete, global, quickshell:sessionToggle

# ----------------------------
# Quickshell "ii" shell surfaces
# ----------------------------
bind = $Modifier, A, global, quickshell:sidebarLeftToggle
bind = $Modifier, N, global, quickshell:sidebarRightToggle
bind = $Modifier, Slash, global, quickshell:cheatsheetToggle
bind = $Modifier, G, global, quickshell:overlayToggle
bind = $Modifier, M, global, quickshell:mediaControlsToggle
bind = CTRL $Modifier, T, global, quickshell:wallpaperSelectorToggle

# ----------------------------
# Window Management
# ----------------------------
bind = $Modifier, C, killactive
bind = $Modifier SHIFT, M, exit
bind = $Modifier, T, togglegroup
bind = $Modifier, V, togglefloating
bind = $Modifier, space, fullscreen
bind = $Modifier, P, pseudo               # dwindle

# ----------------------------
# Lock & Bar
# ----------------------------
bind = $AlMod, L, exec, $lockdaemon

# ----------------------------
# Screenshots & Clipboard
# ----------------------------
bind = $AlMod, D, exec, bash -c 'grim -g "$(slurp)" /tmp/shot.png && cp /tmp/shot.png ~/Pictures/screenshot-$(date +%s).png && wl-copy < /tmp/shot.png'
bind = , Print, exec, bash -c 'grim /tmp/shot-full.png && cp /tmp/shot-full.png ~/Pictures/screenshot-$(date +%s).png && wl-copy < /tmp/shot-full.png'
bind = $AlMod, P, exec, clipvault list | rofi -dmenu -theme ~/.config/rofi/prism.rasi -display-columns 2 | clipvault get | wl-copy

# ----------------------------
# Focus Movement
# ----------------------------
bind = $Modifier, H, movefocus, l
bind = $Modifier, L, movefocus, r
bind = $Modifier, K, movefocus, u
bind = $Modifier, J, movefocus, d

# Tabbed-group focus cycling (also fires alongside movefocus above)
bind = $Modifier, H, changegroupactive, b
bind = $Modifier, L, changegroupactive, f

# ----------------------------
# Workspace Switching
# ----------------------------
bind = $Modifier, 1, workspace, 1
bind = $Modifier, 2, workspace, 2
bind = $Modifier, 3, workspace, 3
bind = $Modifier, 4, workspace, 4
bind = $Modifier, 5, workspace, 5
bind = $Modifier, 6, workspace, 6
bind = $Modifier, 7, workspace, 7
bind = $Modifier, 8, workspace, 8
bind = $Modifier, 9, workspace, 9
bind = $Modifier, 0, workspace, 10

bind = $Modifier SHIFT, 1, movetoworkspace, 1
bind = $Modifier SHIFT, 2, movetoworkspace, 2
bind = $Modifier SHIFT, 3, movetoworkspace, 3
bind = $Modifier SHIFT, 4, movetoworkspace, 4
bind = $Modifier SHIFT, 5, movetoworkspace, 5
bind = $Modifier SHIFT, 6, movetoworkspace, 6
bind = $Modifier SHIFT, 7, movetoworkspace, 7
bind = $Modifier SHIFT, 8, movetoworkspace, 8
bind = $Modifier SHIFT, 9, movetoworkspace, 9
bind = $Modifier SHIFT, 0, movetoworkspace, 10

# ----------------------------
# Mouse Controls
# ----------------------------
bind = $Modifier, mouse_down, workspace, e+1
bind = $Modifier, mouse_up,   workspace, e-1
bindm = $Modifier, mouse:272, movewindow
bindm = $Modifier, mouse:273, resizewindow

# ----------------------------
# Multimedia Keys
# ----------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,  exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown,exec, brightnessctl -e4 -n2 set 5%-

# Keyboard backlight (ThinkPad Fn+Space / XF86KbdLightOnOff, 3 levels: off/low/high)
bindel = , XF86KbdBrightnessUp,   exec, brightnessctl -d tpacpi::kbd_backlight set +1
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d tpacpi::kbd_backlight set 1-
bindl  = , XF86KbdLightOnOff,     exec, ~/.config/hypr/custom/scripts/kbd-backlight-toggle.sh

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
