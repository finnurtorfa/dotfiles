# ┌──────────────────────────────────────────────────────────────┐
# |		      Windows and Workspaces			 	  |
# └──────────────────────────────────────────────────────────────┘

# Keep floating utility windows from being force-maximized
windowrule = match:class .*, suppress_event maximize

# Don't steal focus for empty xwayland helper windows
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on

# Floating + centered for pickers/dialogs
windowrule = match:class ^(nautilus)$, match:title ^(Open File|Save File|.*Properties)$, float on
windowrule = match:class ^(nautilus)$, match:title ^(Open File|Save File|.*Properties)$, center on

# Picture-in-picture stays floating, pinned, on top, on every workspace
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 25% 25%
windowrule = match:title ^(Picture-in-Picture)$, move 74% 74%

# Don't let media players idle-suspend while playing
windowrule = match:class ^(vivaldi)$, idle_inhibit fullscreen

# Rofi/wlogout render as clean floating overlays
windowrule = match:class ^(Rofi)$, float on
windowrule = match:class ^(wlogout)$, float on, no_anim off

# ┌──────────────────────────────────────────────────────────────┐
# |          Quickshell "ii" layer surfaces (bar, sidebars, etc.) |
# └──────────────────────────────────────────────────────────────┘
layerrule = match:namespace ^(quickshell:.*)$, blur 1
layerrule = match:namespace ^(quickshell:.*)$, blur_popups 1
layerrule = match:namespace ^(quickshell:.*)$, ignore_alpha 0.79
layerrule = match:namespace ^(quickshell:bar)$, animation slide
layerrule = match:namespace ^(quickshell:actionCenter)$, no_anim 1
layerrule = match:namespace ^(quickshell:cheatsheet)$, animation slide bottom
layerrule = match:namespace ^(quickshell:dock)$, animation slide bottom
layerrule = match:namespace ^(quickshell:screenCorners)$, animation popin 120%
layerrule = match:namespace ^(quickshell:lockWindowPusher)$, no_anim 1
layerrule = match:namespace ^(quickshell:notificationPopup)$, animation fade
layerrule = match:namespace ^(quickshell:overlay)$, no_anim 1
layerrule = match:namespace ^(quickshell:overlay)$, ignore_alpha 1
layerrule = match:namespace ^(quickshell:overview)$, no_anim 1
layerrule = match:namespace ^(quickshell:osk)$, animation slide bottom
layerrule = match:namespace ^(quickshell:osk)$, order -1
layerrule = match:namespace ^(quickshell:polkit)$, no_anim 1
layerrule = match:namespace ^(quickshell:popup)$, xray 0
layerrule = match:namespace ^(quickshell:popup)$, ignore_alpha 1
layerrule = match:namespace ^(quickshell:mediaControls)$, ignore_alpha 1
layerrule = match:namespace ^(quickshell:reloadPopup)$, animation slide
layerrule = match:namespace ^(quickshell:regionSelector)$, no_anim 1
layerrule = match:namespace ^(quickshell:screenshot)$, no_anim 1
layerrule = match:namespace ^(quickshell:session)$, blur 1
layerrule = match:namespace ^(quickshell:session)$, no_anim 1
layerrule = match:namespace ^(quickshell:session)$, ignore_alpha 0
layerrule = match:namespace ^(quickshell:sidebarRight)$, animation slide right
layerrule = match:namespace ^(quickshell:sidebarLeft)$, animation slide left
layerrule = match:namespace ^(quickshell:verticalBar)$, animation slide
layerrule = match:namespace ^(quickshell:wallpaperSelector)$, animation slide top
layerrule = match:namespace ^(quickshell:wNotificationCenter)$, no_anim 1
layerrule = match:namespace ^(quickshell:wOnScreenDisplay)$, no_anim 1
layerrule = match:namespace ^(quickshell:wStartMenu)$, no_anim 1
layerrule = match:namespace ^(quickshell:wTaskView)$, ignore_alpha 0
layerrule = match:namespace ^(quickshell:wTaskView)$, no_anim 1
