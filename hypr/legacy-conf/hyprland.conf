# Hyprland Configuration
# @ Prism — a Material-You inspired rice, spirit borrowed from
#   end-4/dots-hyprland (illogical-impulse), adapted to plain hyprlang
#   so it stays stable across Hyprland versions instead of depending on
#   their bleeding-edge Lua config API / quickshell shell.
#
# Reference clone kept at:
#   ~/bin/hypr/reference/dots-hyprland
#
# --------------------------- SOF -------------------------------#

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/defaults.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/envvars.conf
source = ~/.config/hypr/conf/perms.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/binds.conf
source = ~/.config/hypr/conf/rules.conf
source = ~/.config/hypr/conf/looks.conf
source = ~/.config/hypr/animations/Prism.conf

# --------------------------- EOF -------------------------------#
