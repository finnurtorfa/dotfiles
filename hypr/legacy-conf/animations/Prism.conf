# ----------------------------------------------------------------
#  Prism animation set
#  Bezier curves ported from end-4/dots-hyprland's Material 3
#  "expressive" motion system (hypr/hyprland/general.lua), applied
#  with plain hyprlang `animation =` lines instead of their Lua API.
# ----------------------------------------------------------------

animations {
    enabled = true

    bezier = expressiveFastSpatial,    0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial,    0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel,          0.05, 0.70, 0.10, 1.00
    bezier = emphasizedAccel,          0.30, 0.00, 0.80, 0.15
    bezier = standardDecel,            0.00, 0.00, 0.00, 1.00
    bezier = linear,                   0.00, 0.00, 1.00, 1.00

    animation = windows,        1, 4, expressiveDefaultSpatial, popin 85%
    animation = windowsIn,      1, 4, expressiveFastSpatial,    popin 85%
    animation = windowsOut,     1, 3, emphasizedAccel,          popin 85%
    animation = windowsMove,    1, 4, expressiveDefaultSpatial

    animation = border,         1, 6, linear
    animation = borderangle,    1, 20, linear, loop

    animation = fade,           1, 4, standardDecel
    animation = fadeIn,         1, 3, emphasizedDecel
    animation = fadeOut,        1, 3, emphasizedAccel

    animation = layers,         1, 4, expressiveDefaultSpatial
    animation = layersIn,       1, 4, expressiveFastSpatial, slide
    animation = layersOut,      1, 3, emphasizedAccel,       slide

    animation = workspaces,     1, 5, expressiveDefaultSpatial, slidefade 15%
    animation = specialWorkspace, 1, 4, expressiveSlowSpatial, slidevert
}
